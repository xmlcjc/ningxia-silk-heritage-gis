<!doctype html>
<html lang="zh-CN">
    <head>
        <title>文物三维场景展示</title>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <link rel="stylesheet" href="/viewer/index.css" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
            }

            /* 仅保留飞行相机：隐藏环绕/行走相机与动画播放控件 */
            .sse-orbitCamera,
            .sse-fpsCamera,
            .sse-play,
            .sse-pause,
            .sse-timelineContainer,
            .sse-time {
                display: none !important;
            }

            /*
             * P2-10 · 操作提示面板（.sse-controlsHint）
             * 短 iframe 中该面板以 bottom:86px 固定定位且没有高度上限，顶部会越界。
             * 这里限制最大高度，并让「标题 + 关闭按钮」固定、仅提示条目内部滚动。
             */
            .sse-viewer .sse-controlsHint {
                display: flex;
                flex-direction: column;
                max-height: calc(100% - 100px);
            }

            .sse-viewer .sse-controlsHint > .sse-controlsHintHeader {
                flex: 0 0 auto;
            }

            .sse-viewer .sse-controlsHint > .sse-controlsHintRows {
                flex: 1 1 auto;
                min-height: 0;
                overflow-y: auto;
                touch-action: pan-y;
                overscroll-behavior: contain;
            }

            .sse-viewer .sse-controlsHint > .sse-controlsHintRows * {
                touch-action: pan-y;
            }

            /*
             * P2-10 · 信息面板触摸滚动
             * 查看器的 .sse-viewer * { touch-action: none } 会禁用原生触摸滚动，
             * 导致 overflow-y:auto 的信息面板在手机上无法翻到底部。
             * 仅恢复滚动容器及其内容；画布、工具栏与 .sse-ui 根层保持原有
             * touch-action:none，环视 / 飞行手势不受影响。
             */
            .sse-viewer .sse-infoPanel > .sse-infoPanelContent {
                touch-action: pan-y;
                overscroll-behavior: contain;
            }

            .sse-viewer .sse-infoPanel > .sse-infoPanelContent * {
                touch-action: pan-y;
            }

            /*
             * P2-10 · 触屏设备提示内容
             * 只隐藏键盘 / 鼠标专有说明，保留点击、拖动、捏合、双击等手势行。
             * 桌面端为 fine pointer，本节规则不生效，WASD / Shift / Ctrl / R / H 照常显示。
             */
            @media (pointer: coarse) {
                .sse-viewer .sse-infoShortcuts {
                    display: none !important;
                }

                .sse-viewer .sse-controlsHint:has(.sse-key),
                .sse-viewer .sse-controlsHint:has(.sse-mouse) {
                    display: none !important;
                }
            }

            /*
             * P2-10 · 触控热区
             * 信息面板关闭按钮与五个工具栏按钮放大到 44×44。
             * 操作提示面板标题行只有 26px 高，直接放大按钮会挤掉提示内容，
             * 因此保持布局高度 26px（上下各 -9px 外边距），实际可点区域为 44×44。
             */
            @media (pointer: coarse) {
                .sse-viewer .sse-infoPanel > .sse-infoPanelContent > .sse-infoClose {
                    top: 4px;
                    right: 4px;
                    width: 44px;
                    height: 44px;
                }

                .sse-viewer .sse-controlsHint > .sse-controlsHintHeader > .sse-controlsHintClose {
                    flex: 0 0 auto;
                    width: 44px;
                    height: 44px;
                    margin: -9px 0;
                }

                .sse-viewer .sse-controlsWrap > .sse-buttonsContainer .sse-controlButton {
                    width: 44px;
                    height: 44px;
                }
            }
        </style>
    </head>
    <body>
        <script type="module">
            import { createViewer } from '/viewer/index.js';

            const sp = new URL(location.href).searchParams;
            const contentUrl = sp.get('content');
            const settingsUrl = sp.get('settings') || '/viewer/settings.json';
            const posterUrl = sp.get('poster');
            const poster = posterUrl ? new Image() : null;
            if (poster) poster.src = posterUrl;

            const viewer = await createViewer({
                container: document.body,
                contentUrl,
                posterUrl,
                poster,
                settings: fetch(settingsUrl).then((response) => response.json()),
                lang: sp.get('lang') || 'zh-CN',
                // 取消动画：始终以暂停状态进入
                noanim: true,
                ui: true
            });

            // 环绕拍摄的物体模型没有预设拍摄视角，交由查看器按包围盒自动框选，
            // 并保留环绕相机（物体展示以拖动环视为主，飞行相机不易操控）
            if (sp.get('autoframe')) {
                viewer.events.on('loaded:changed', (loaded) => {
                    if (loaded) viewer.frameScene();
                });
                if (viewer.state.loaded) viewer.frameScene();
            } else {
                // 仅保留飞行相机：首个渲染帧后切入飞行模式，并拦截后续任何模式切换
                // （环绕相机 / 动画相机 / 行走模式，含按钮、快捷键与点击触发）
                const pinFly = () => {
                    if (viewer.state.cameraMode !== 'fly') {
                        viewer.state.cameraMode = 'fly';
                    }
                };
                viewer.events.on('cameraMode:changed', pinFly);
                viewer.events.on('loaded:changed', (loaded) => {
                    if (loaded) pinFly();
                });
                if (viewer.state.loaded) pinFly();
            }

            // 动画保持暂停（模型无动画轨道时同样兜底）
            viewer.state.animationPaused = true;
        </script>
    </body>
</html>
